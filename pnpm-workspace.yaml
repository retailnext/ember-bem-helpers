allowBuilds:
  core-js: false
  esbuild: false

# Docs: https://pnpm.io/settings
# https://github.com/emberjs/rfcs/pull/907

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

overrides:
  brace-expansion@<1.1.21: ">=1.1.21 <2"
  brace-expansion@>=2.0.0 <2.1.7: ">=2.1.7 <3"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12"
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4

# we want true isolation,
# if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false
